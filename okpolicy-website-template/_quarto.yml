project:
  type: website
  render:
    - "*.qmd"
    - "!wip/"

website:
  title: "Oklahoma Policy Institute"
  favicon: www/favicon.gif
  search: false
  # link previews:  the opi logo is shown by default when a link to a page is shared (slack, social media, etc.)
  # ... to change to a custom logo replace the open-graph and twitter-card URLs
  open-graph:
    image: https://raw.githubusercontent.com/openjusticeok/okpolicy-quarto-templates/main/okpolicy-website-template/www/okpi-square.png
  twitter-card:
    image: https://raw.githubusercontent.com/openjusticeok/okpolicy-quarto-templates/main/okpolicy-website-template/www/okpi-square.png
    card-style: summary
  navbar:
    background: "#2f507f"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: About
      - text: Reports
        menu:
          - href: report-1/index.qmd
            text: "Report 1"
          - href: report-2/index.qmd
            text: "Report 2"

format:
  okpolicy-website-template-html:
    css:
      - draft.css
    include-before-body:
      - draft-banner.html
  html:
    toc: true
